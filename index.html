<style>
/* Layout: one narrow phone column, sticky header, fixed bottom tab bar; cards only for exercises and records */
:root{
  --bg:#eceef2; --surface:#ffffff; --sunk:#e2e5eb; --ink:#141922; --ink-2:#485061; --ink-3:#778095;
  --line:#d6dae2; --accent:#1d4bd0; --accent-soft:#dfe6fb; --on-accent:#ffffff;
  --up:#17784a; --up-soft:#dcf1e5; --down:#b8352a; --down-soft:#f8e1de; --stay:#525b6e; --stay-soft:#e4e7ed;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1116; --surface:#181c24; --sunk:#11151b; --ink:#e8ebf1; --ink-2:#aeb5c3; --ink-3:#7d8596;
  --line:#2a303b; --accent:#7096ff; --accent-soft:#1d2848; --on-accent:#0b1020;
  --up:#4cc283; --up-soft:#15301f; --down:#ff7f70; --down-soft:#3a1c19; --stay:#a3abbb; --stay-soft:#252a34; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1116; --surface:#181c24; --sunk:#11151b; --ink:#e8ebf1; --ink-2:#aeb5c3; --ink-3:#7d8596;
  --line:#2a303b; --accent:#7096ff; --accent-soft:#1d2848; --on-accent:#0b1020;
  --up:#4cc283; --up-soft:#15301f; --down:#ff7f70; --down-soft:#3a1c19; --stay:#a3abbb; --stay-soft:#252a34; color-scheme:dark}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--tabh) + 96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:14px 10px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.brand span{color:var(--accent)}
.top .sub{color:var(--ink-3);font-size:14px}

h2{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.01em;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:19px;margin:0;line-height:1.15}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.section{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:var(--r);padding:10px 12px;font-size:14px;margin-bottom:16px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;min-height:44px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--down);border-color:var(--down)}
.btn.small{min-height:36px;padding:6px 10px;font-size:14px}
.btn.block{width:100%}
.linkish{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;font-size:14px;min-height:36px}

input.field,select.field,textarea.field{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;font-size:16px}
.fieldwrap{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}

/* routine picker */
.routine{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.routine .ex{grid-column:1/-1;color:var(--ink-2);font-size:14px}
.routine .go{font-family:var(--display);font-weight:700;font-size:18px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.routine.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.up{background:var(--up-soft);color:var(--up)}
.pill.down{background:var(--down-soft);color:var(--down)}
.pill.stay{background:var(--stay-soft);color:var(--stay)}

/* active workout */
.sessionbar{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.excard{display:flex;flex-direction:column;gap:12px}
.excard .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.excard .last{font-size:14px;color:var(--ink-2)}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;flex-direction:column;gap:4px;min-width:0}
.stepper .ctl{display:grid;grid-template-columns:44px 1fr 44px;align-items:stretch;background:var(--sunk);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper.wide .ctl{grid-template-columns:52px 1fr 52px}
.stepper button{border:0;background:transparent;font-size:22px;font-weight:600;color:var(--accent);min-height:48px}
.stepper button:active{background:var(--accent-soft)}
.stepper input{border:0;background:transparent;text-align:center;font-family:var(--display);font-weight:700;font-size:26px;width:100%;min-width:0;padding:0}
.stepper input:focus{outline:none}
.stepper .ctl:focus-within{border-color:var(--accent)}
.plates{font-size:13px;color:var(--ink-3)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:46px;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink-2)}
.seg button[aria-pressed="true"].down{background:var(--down-soft);border-color:var(--down);color:var(--down)}
.seg button[aria-pressed="true"].stay{background:var(--stay-soft);border-color:var(--stay);color:var(--stay)}
.seg button[aria-pressed="true"].up{background:var(--up-soft);border-color:var(--up);color:var(--up)}
.tri{width:10px;height:10px;display:inline-block}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);min-height:36px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.iconbtn{border:0;background:transparent;color:var(--ink-3);min-width:36px;min-height:36px;border-radius:8px;font-size:18px}
.iconbtn:hover{background:var(--sunk)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--down-soft);border-radius:10px;padding:8px 10px;font-size:14px}

/* timer */
.timer{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));z-index:6;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.timer .inner{max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 10px;display:flex;align-items:center;gap:8px;pointer-events:auto;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.timer .clock{font-family:var(--display);font-weight:700;font-size:28px;min-width:72px;text-align:center}
.timer button{border:0;border-radius:8px;background:rgba(127,127,127,.25);color:inherit;font-weight:600;min-height:38px;padding:0 10px;font-size:14px}
.timer .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-right:auto}
.timer.done .inner{background:var(--up);color:#fff;animation:pulse .6s ease-in-out 3}
@keyframes pulse{50%{transform:scale(1.03)}}
@media (prefers-reduced-motion:reduce){.timer.done .inner{animation:none}}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);font-size:12px;font-weight:600;letter-spacing:.03em}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* stats & charts */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--display);font-weight:700;font-size:28px;line-height:1}
.stat .v small{font-size:15px;font-weight:600;color:var(--ink-3);margin-left:2px}
.good{color:var(--up)} .bad{color:var(--down)}
.chart{position:relative;width:100%;min-height:200px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--body);font-size:11px;fill:var(--ink-3)}
.chart .vlabel{font-family:var(--display);font-weight:700;font-size:14px;fill:var(--ink)}
.chart-empty{min-height:160px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ink-3);font-size:14px;background:var(--sunk);border-radius:10px;padding:16px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:6px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);top:0;left:0}
.tip b{font-family:var(--display);font-size:16px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}

table.log{width:100%;border-collapse:collapse;font-size:14px}
table.log th{text-align:left;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:6px 4px;border-bottom:1px solid var(--line)}
table.log td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.log td.r,table.log th.r{text-align:right}
.liftrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:10px 2px}
.liftrow .n{font-weight:600}
.liftrow .d{font-size:14px;color:var(--ink-2)}
.liftrow[aria-current="true"] .n{color:var(--accent)}

/* history */
.hist .exline{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.hist .exline .m{font-size:13px;color:var(--ink-3);grid-column:1/-1}
.hist .meta{font-size:14px;color:var(--ink-2)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 80px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.reorder{display:flex;gap:2px}
.redit{display:grid;grid-template-columns:1fr;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.redit .r2{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
</style>
</head>

<script>
(() => {
const EQUIP = {barbell:"Barbell", dumbbell:"Dumbbell", machine:"Machine", cable:"Cable", bodyweight:"Bodyweight"};
const INC = 5, BAR = 45;
const S = {
  routines: [], workouts: [], bodyweight: [], active: null, activeStamp: 0,
  tab: "workout", view: "start", editRoutine: null, confirm: null, lift: null,
  addingEx: false, mode: "loading", timer: null, pendingRender: false
};

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const nowTime = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const parseDate = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, m-1, d); };
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const fmtShort = s => { const d = parseDate(s); return `${MON[d.getMonth()]} ${d.getDate()}`; };
const fmtLong = s => { const d = parseDate(s); return `${DOW[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}`; };
const fmtTime = t => { if (!t) return ""; let [h, m] = t.split(":").map(Number); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return `${h}:${pad(m)} ${ap}`; };
const minutes = (a, b) => { if (!a || !b) return null; const [h1,m1] = a.split(":").map(Number), [h2,m2] = b.split(":").map(Number); let d = (h2*60+m2) - (h1*60+m1); if (d < 0) d += 1440; return d; };
const fmtDur = m => m == null ? "" : m < 60 ? `${m} min` : `${Math.floor(m/60)} h ${m%60} min`;
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null; };
const fmtW = n => n == null ? "–" : (Math.round(n * 10) / 10).toString();
const key = s => String(s || "").trim().toLowerCase();
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const CALL = {
  up:   {label:"Increase", short:"Up",   icon:'<svg class="tri" viewBox="0 0 10 10"><path d="M5 1 9.5 9h-9z" fill="currentColor"/></svg>'},
  stay: {label:"Maintain", short:"Stay", icon:'<svg class="tri" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="currentColor"/></svg>'},
  down: {label:"Decrease", short:"Down", icon:'<svg class="tri" viewBox="0 0 10 10"><path d="M5 9 .5 1h9z" fill="currentColor"/></svg>'}
};
const callPill = c => c && CALL[c] ? `<span class="pill ${c}">${CALL[c].icon}${CALL[c].short}</span>` : "";
const repsText = e => `${e.sets ?? "?"}×${e.reps ?? "?"}${e.perSide ? "/side" : ""}`;
const weightText = e => {
  if (e.equip === "bodyweight" && e.weight == null) return "Bodyweight";
  const s = num(e.startWeight), w = num(e.weight);
  const unit = e.equip === "dumbbell" ? " lb ea" : " lb";
  return (s != null && s !== w ? `${fmtW(s)} → ` : "") + fmtW(w) + unit;
};

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2400);
}

/* ---------- storage: this phone (localStorage), plus backup files ---------- */
const LKEY = "stronk-local-v1", BKEY = "stronk-last-backup";
let storageOK = true;
function localSave() {

/* ---------- charts ---------- */
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function drawChart(el, pts, opt = {}) {
  if (!el) return;
  if (!pts.length) { el.innerHTML = `<div class="chart-empty">${esc(opt.empty || "Nothing logged yet.")}</div>`; return; }
  const W = Math.max(280, Math.round(el.clientWidth || 340)), H = 210, m = {l: 38, r: 16, t: 26, b: 26};
  const ys = pts.map(p => p.y);

  const step = niceStep(span / 3);

  const X = t => m.l + (t - t0) / (t1 - t0) * (W - m.l - m.r);

  const nT = Math.min(4, Math.max(2, Math.floor((W - m.l - m.r) / 80)));
  for (let i = 0; i <= nT; i++) {
    const t = t0 + (t1 - t0) * i / nT, d = new Date(t);

  }

  const area = pts.length > 1 ? `<path d="${line}L${X(pts[pts.length-1].t).toFixed(1)},${Y(y0)}L${X(pts[0].t).toFixed(1)},${Y(y0)}Z" fill="var(--accent)" opacity=".07"/>` : "";

    const x = X(p.t), y = Y(p.y), r = big ? 6 : 4.5;
    const col = p.call === "up" ? "var(--up)" : p.call === "down" ? "var(--down)" : "var(--accent)";
    if (p.call === "up") return `<path d="M${x},${y - r - 1.5}L${x + r + 1},${y + r - .5}L${x - r - 1},${y + r - .5}Z" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`;
    if (p.call === "down") return `<path d="M${x},${y + r + 1.5}L${x + r + 1},${y - r + .5}L${x - r - 1},${y - r + .5}Z" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`;
    return `<circle cx="${x}" cy="${y}" r="${r}" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`;
  };

  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria || "Progress chart")}">
    ${g}${area}${pts.length > 1 ? `<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : ""}
    ${pts.map((p, i) => mark(p, i === pts.length - 1)).join("")}
    <text class="vlabel" x="${lx}" y="${Y(lp.y) - 12}" text-anchor="${anchor}">${fmtW(lp.y)} ${esc(opt.unit || "lb")}</text>
    <line id="xh" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent" style="touch-action:pan-y"/>
  </svg><div class="tip" hidden></div>`;
  const svg = el.querySelector("svg"), tip = el.querySelector(".tip"), xh = el.querySelector("#xh");
  const show = ev => {
    const r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) * W / r.width;
    let best = pts[0]; for (const p of pts) if (Math.abs(X(p.t) - sx) < Math.abs(X(best.t) - sx)) best = p;
    const px = X(best.t);
    xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.setAttribute("visibility", "visible");
    tip.hidden = false; tip.innerHTML = opt.tip ? opt.tip(best) : `<b>${fmtW(best.y)}</b>`;
    const left = px * r.width / W, half = tip.offsetWidth / 2;
    tip.style.left = Math.min(r.width - half, Math.max(half, left)) + "px";

}

      <div class="ctl"><button data-act="step" data-i="${i}" data-f="weight" data-d="-${INC}" aria-label="Minus ${INC}">−</button><input id="ex-${i}-weight" data-i="${i}" data-f="weight" inputmode="decimal" value="${e.weight ?? ""}" placeholder="0" aria-label="Weight"><button data-act="step" data-i="${i}" data-f="weight" data-d="${INC}" aria-label="Plus ${INC}">+</button></div>
      <div class="plates" id="plates-${i}">${plateText(e)}</div>
    </div>
    ${e.startWeight != null || S.confirm === `ramp-${i}` ? `<div class="row" style="flex-wrap:nowrap"><div class="fieldwrap"><span class="label">Started at (ramped up)</span><input class="field num" id="ex-${i}-startWeight" data-i="${i}" data-f="startWeight" inputmode="decimal" value="${e.startWeight ?? ""}" placeholder="e.g. 65"></div><button class="iconbtn" data-act="noramp" data-i="${i}" aria-label="Remove starting weight" style="align-self:flex-end">✕</button></div>`
      : `<button class="linkish" data-act="ramp" data-i="${i}" style="align-self:flex-start">+ Ramped up from a lighter weight</button>`}`}
    <div class="stack" style="gap:6px">
      <span class="label">Next time</span>
      <div class="seg" role="group" aria-label="Next time">
        ${["down", "stay", "up"].map(c => `<button class="${c}" data-act="call" data-i="${i}" data-c="${c}" aria-pressed="${e.call === c}">${CALL[c].icon}${CALL[c].label}</button>`).join("")}
      </div>
      ${e.call && e.call !== "stay" && e.equip !== "bodyweight" ? `<div class="row" style="flex-wrap:nowrap"><span class="muted" style="font-size:14px;white-space:nowrap">Next time use</span><input class="field num" style="max-width:110px" id="ex-${i}-next" data-i="${i}" data-f="next" inputmode="decimal" value="${e.next ?? ""}"><span class="muted" style="font-size:14px">${unit}</span></div>` : ""}
    </div>
    <div class="row" style="justify-content:space-between">
      <label class="check"><input type="checkbox" id="ex-${i}-perSide" data-i="${i}" data-f="perSide" ${e.perSide ? "checked" : ""}>Reps are per side</label>
    </div>
    <input class="field" id="ex-${i}-note" data-i="${i}" data-f="note" value="${esc(e.note)}" placeholder="Note (optional)" aria-label="Note">
  </div>`;
}
function stepper(i, f, label, val, d) {
  return `<div class="stepper"><span class="label">${label}</span><div class="ctl"><button data-act="step" data-i="${i}" data-f="${f}" data-d="-${d}" aria-label="Fewer ${f}">−</button><input id="ex-${i}-${f}" data-i="${i}" data-f="${f}" inputmode="numeric" value="${val ?? ""}" aria-label="${label}"><button data-act="step" data-i="${i}" data-f="${f}" data-d="${d}" aria-label="More ${f}">+</button></div></div>`;
}

function viewActive() {
  const a = S.active;
  const known = [...new Set([...S.workouts.flatMap(w => (w.exercises || []).map(e => e.name)), ...S.routines.flatMap(r => (r.exercises || []).map(e => e.name))])].sort();
  const dur = minutes(a.timeIn, a.timeOut || (a.editingId ? "" : nowTime()));
  return `
  <div class="section">
    <div class="row between"><h2>${esc(a.routineName || "Workout")}</h2><span class="muted num" style="font-size:14px">${dur != null ? fmtDur(dur) + (a.timeOut ? "" : " so far") : ""}</span></div>
    <div class="sessionbar">
      <div class="fieldwrap"><span class="label">Date</span><input class="field" type="date" id="s-date" data-s="date" value="${esc(a.date)}"></div>
      <div class="fieldwrap"><span class="label">Time in</span><input class="field" type="time" id="s-timeIn" data-s="timeIn" value="${esc(a.timeIn)}"></div>
    </div>
    <div class="fieldwrap"><span class="label">Warmup</span><input class="field" id="s-warmup" data-s="warmup" value="${esc(a.warmup)}" placeholder="e.g. Bike 10 min"></div>

        <datalist id="known-ex">${known.map(n => `<option value="${esc(n)}">`).join("")}</datalist>
        <select class="field" id="add-equip">${Object.entries(EQUIP).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select>
        <div class="row"><button class="btn primary" data-act="addex">Add</button><button class="btn ghost" data-act="addex-cancel">Cancel</button></div>
      </div>` : `<button class="btn block" data-act="addex-open">+ Add exercise</button>`}
  </div>
  <div class="section">
    <div class="fieldwrap"><span class="label">Cooldown</span><input class="field" id="s-cooldown" data-s="cooldown" value="${esc(a.cooldown)}" placeholder="e.g. Walk 10 min 2.5"></div>
    ${a.editingId ? `<div class="fieldwrap"><span class="label">Time out</span><input class="field" type="time" id="s-timeOut" data-s="timeOut" value="${esc(a.timeOut)}"></div>` : ""}
    <button class="btn primary block" data-act="finish">${a.editingId ? "Save changes" : "Finish workout"}</button>
    ${S.confirm === "discard"
      ? `<div class="confirm">${a.editingId ? "Drop your edits to this workout?" : "Throw away this workout? Nothing will be saved."} <button class="btn small danger" data-act="discard">${a.editingId ? "Drop edits" : "Discard"}</button><button class="btn small" data-act="ask" data-key="">Keep going</button></div>`
      : `<button class="btn ghost block" data-act="ask" data-key="discard">${a.editingId ? "Cancel editing" : "Discard workout"}</button>`}
  </div>`;
}

function viewHistory() {

  return `<div class="section"><h2>History</h2>${ws.map(w => {
    const d = minutes(w.timeIn, w.timeOut);
    return `<div class="card hist stack" style="gap:8px">
      <div class="row between" style="align-items:flex-start;flex-wrap:nowrap">
        <div class="stack" style="gap:2px"><h3>${fmtLong(w.date)}</h3><div class="meta">${esc(w.routineName || "Workout")}${w.timeIn ? ` · ${fmtTime(w.timeIn)}${w.timeOut ? `–${fmtTime(w.timeOut)}` : ""}` : ""}${d != null ? ` · ${fmtDur(d)}` : ""}</div></div>
        <button class="btn small" data-act="edit" data-id="${esc(w.id)}">Edit</button>
      </div>
      ${w.warmup ? `<div class="meta"><span class="label">Warmup</span> ${esc(w.warmup)}</div>` : ""}
      <div>${(w.exercises || []).map(e => `<div class="exline"><span>${esc(e.name)}</span><span class="num">${repsText(e)} · ${weightText(e)}</span>${e.call || e.note ? `<span class="m">${callPill(e.call)}${e.call && e.call !== "stay" && e.next != null ? ` next ${fmtW(e.next)} lb` : ""}${e.note ? ` “${esc(e.note)}”` : ""}</span>` : ""}</div>`).join("")}</div>

        : `<button class="linkish" style="color:var(--ink-3);align-self:flex-start" data-act="ask" data-key="delw-${esc(w.id)}">Delete workout</button>`}

  }).join("")}</div>`;
}

function liftSeries() {
  const map = new Map();
  for (const w of [...S.workouts].sort((a, b) => (a.date + (a.timeIn||"")).localeCompare(b.date + (b.timeIn||"")))) {
    for (const e of w.exercises || []) {
      const k = key(e.name); if (!k) continue;
      if (!map.has(k)) map.set(k, {name: e.name, equip: e.equip, pts: []});
      const s = map.get(k); s.name = e.name; s.equip = e.equip;
      const y = num(e.weight);
      if (y != null) s.pts.push({t: parseDate(w.date).getTime(), y, date: w.date, e});
    }
  }
  return map;
}
function viewProgress() {
  const map = liftSeries();
  if (!map.size) return `<div class="section"><h2>Progress</h2><div class="chart-empty">Log a workout to start seeing your lifts climb.</div></div>`;
  const lifts = [...map.entries()].sort((a, b) => b[1].pts.length - a[1].pts.length || a[1].name.localeCompare(b[1].name));
  if (!S.lift || !map.has(S.lift)) {
    const recent = sortedWorkouts()[0]; const first = recent && (recent.exercises || [])[0];
    S.lift = first && map.has(key(first.name)) ? key(first.name) : lifts[0][0];
  }
  const s = map.get(S.lift), p = s.pts;
  const first = p[0], lastP = p[p.length - 1], ch = p.length ? lastP.y - first.y : null;
  return `<div class="section">
    <h2>Progress</h2>
    <select class="field" id="lift-pick" aria-label="Exercise">${lifts.map(([k, v]) => `<option value="${esc(k)}"${k === S.lift ? " selected" : ""}>${esc(v.name)}</option>`).join("")}</select>
    <div class="card stack">
      <div class="stats">
        <div class="stat"><span class="label">Started</span><span class="v num">${p.length ? fmtW(first.y) : "–"}<small>lb</small></span></div>
        <div class="stat"><span class="label">Now</span><span class="v num">${p.length ? fmtW(lastP.y) : "–"}<small>lb</small></span></div>
        <div class="stat"><span class="label">Change</span><span class="v num ${ch > 0 ? "good" : ch < 0 ? "bad" : ""}">${ch == null ? "–" : (ch > 0 ? "+" : "") + fmtW(ch)}<small>lb</small></span></div>
      </div>
      <div class="chart" id="lift-chart"></div>
      <div class="legend"><span style="color:var(--up)">${CALL.up.icon}<span style="color:var(--ink-2)">Said increase</span></span><span style="color:var(--accent)">${CALL.stay.icon}<span style="color:var(--ink-2)">Maintain</span></span><span style="color:var(--down)">${CALL.down.icon}<span style="color:var(--ink-2)">Said decrease</span></span></div>
      <div class="muted" style="font-size:13px">Top working weight each session${s.equip === "dumbbell" ? ", per dumbbell" : ""}. Tap the chart for details.</div>
    </div>
    <div style="overflow-x:auto"><table class="log num"><thead><tr><th>Date</th><th>Sets×reps</th><th class="r">Weight</th><th class="r">Next</th></tr></thead><tbody>
      ${[...p].reverse().map(x => `<tr><td>${fmtShort(x.date)}</td><td>${repsText(x.e)}</td><td class="r">${weightText(x.e)}</td><td class="r">${callPill(x.e.call)}</td></tr>`).join("")}
    </tbody></table></div>
  </div>
  <div class="section">
    <h2>All lifts</h2>
    <div>${lifts.map(([k, v]) => {
      const a = v.pts[0], b = v.pts[v.pts.length - 1], d = a && b ? b.y - a.y : null;
      return `<button class="liftrow" data-act="lift" data-k="${esc(k)}" aria-current="${k === S.lift}"><span class="n">${esc(v.name)}</span><span class="num ${d > 0 ? "good" : d < 0 ? "bad" : "muted"}" style="font-weight:600">${d == null ? "" : (d > 0 ? "+" : "") + fmtW(d) + " lb"}</span><span class="d num">${a ? `${fmtW(a.y)} → ${fmtW(b.y)} lb` : "No weights"} · ${v.pts.length} session${v.pts.length === 1 ? "" : "s"}</span></button>`;
    }).join("")}</div>
  </div>`;
}
function drawLift() {
  const s = liftSeries().get(S.lift); if (!s) return;
  drawChart($("#lift-chart"), s.pts.map(p => ({t: p.t, y: p.y, call: p.e.call, p})), {
    aria: `${s.name} weight over time`, unit: "lb",
    empty: "No weights logged for this exercise yet.",
    tip: b => `${fmtShort(b.p.date)} · <b>${fmtW(b.y)} lb</b> · ${repsText(b.p.e)}${b.call ? " · " + CALL[b.call].short : ""}`
  });
  if (s.pts.length === 1) $("#lift-chart").insertAdjacentHTML("beforeend", `<div class="muted" style="font-size:13px;text-align:center">One session so far. Your trend line appears after the next one.</div>`);
}

function viewBody() {
  const bw = [...S.bodyweight].sort((a, b) => a.date.localeCompare(b.date));
  const first = bw[0], last = bw[bw.length - 1], ch = bw.length > 1 ? last.weight - first.weight : null;
  const low = bw.length ? Math.min(...bw.map(b => b.weight)) : null;
  return `<div class="section">
    <h2>Body weight</h2>
    <div class="card stack">
      <div class="row" style="flex-wrap:nowrap;align-items:flex-end">

        <div class="fieldwrap"><span class="label">Weight · lb</span><input class="field num" id="bw-weight" inputmode="decimal" placeholder="${last ? fmtW(last.weight) : "e.g. 210.4"}"></div>
      </div>
      <button class="btn primary block" data-act="bw-save">Save weigh-in</button>
    </div>
  </div>
  <div class="section">
    <div class="card stack">
      <div class="stats">
        <div class="stat"><span class="label">Current</span><span class="v num">${last ? fmtW(last.weight) : "–"}<small>lb</small></span></div>
        <div class="stat"><span class="label">Change</span><span class="v num ${ch < 0 ? "good" : ch > 0 ? "bad" : ""}">${ch == null ? "–" : (ch > 0 ? "+" : "") + fmtW(ch)}<small>lb</small></span></div>
        <div class="stat"><span class="label">Lowest</span><span class="v num">${low == null ? "–" : fmtW(low)}<small>lb</small></span></div>

    </div>
  </div>
  ${bw.length ? `<div class="section"><h2>Weigh-ins</h2><div style="overflow-x:auto"><table class="log num"><thead><tr><th>Date</th><th class="r">Weight</th><th class="r">vs. previous</th><th></th></tr></thead><tbody>
    ${[...bw].reverse().map((b, i, arr) => { const prev = arr[i + 1]; const d = prev ? b.weight - prev.weight : null;
      return `<tr><td>${fmtLong(b.date)}</td><td class="r">${fmtW(b.weight)} lb</td><td class="r ${d < 0 ? "good" : d > 0 ? "bad" : "muted"}">${d == null ? "" : (d > 0 ? "+" : "") + fmtW(d)}</td><td class="r">${S.confirm === `delbw-${b.id}` ? `<button class="btn small danger" data-act="delbw" data-id="${esc(b.id)}">Delete</button>` : `<button class="iconbtn" data-act="ask" data-key="delbw-${esc(b.id)}" aria-label="Delete weigh-in">✕</button>`}</td></tr>`; }).join("")}
  </tbody></table></div></div>` : ""}`;
}
function drawBody() {
  const bw = [...S.bodyweight].sort((a, b) => a.date.localeCompare(b.date));
  drawChart($("#bw-chart"), bw.map(b => ({t: parseDate(b.date).getTime(), y: b.weight, date: b.date})), {
    aria: "Body weight over time", unit: "lb", empty: "Log your first weigh-in above to start the chart.",
    tip: b => `${fmtShort(b.date)} · <b>${fmtW(b.y)} lb</b>`
  });
}

/* ---------- events ---------- */
document.addEventListener("click", ev => {
  const tabBtn = ev.target.closest("nav.tabs button");
  if (tabBtn) { S.tab = tabBtn.dataset.tab; S.confirm = null; render(); window.scrollTo(0, 0); return; }
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, i = +b.dataset.i, a = S.active;
  const ex = a && a.exercises[i];
  switch (act) {
    case "tab": S.tab = b.dataset.tab; render(); window.scrollTo(0, 0); break;
    case "start": startWorkout(b.dataset.id); break;
    case "routines": S.view = "routines"; S.editRoutine = null; render(); break;
    case "back": S.view = "start"; render(); break;
    case "ask": S.confirm = b.dataset.key || null; render(); break;
    case "step": {
      const f = b.dataset.f, d = +b.dataset.d, cur = num(ex[f]);
      let v = (cur ?? (f === "weight" ? 0 : 0)) + d;
      v = Math.max(f === "weight" ? 0 : 1, Math.round(v * 100) / 100);
      ex[f] = v; $(`#ex-${i}-${f}`).value = v;
      if (f === "weight") $(`#plates-${i}`).textContent = plateText(ex);
      saveActiveSoon(); break;
    }
    case "call": {
      const c = b.dataset.c; ex.call = ex.call === c ? null : c;
      const w = num(ex.weight);
      ex.next = ex.call === "up" && w != null ? w + INC : ex.call === "down" && w != null ? Math.max(0, w - INC) : null;
      replaceCard(i); saveActiveSoon(); break;
    }
    case "ramp": S.confirm = `ramp-${i}`; replaceCard(i); $(`#ex-${i}-startWeight`)?.focus(); break;
    case "noramp": ex.startWeight = null; S.confirm = null; replaceCard(i); saveActiveSoon(); break;
    case "exmove": {
      const j = i + +b.dataset.d; if (j < 0 || j >= a.exercises.length) break;
      [a.exercises[i], a.exercises[j]] = [a.exercises[j], a.exercises[i]]; S.confirm = null; saveActiveSoon(); render();
      document.getElementById(`card-${j}`)?.scrollIntoView({block: "nearest"}); break;
    }
    case "rmex": a.exercises.splice(i, 1); S.confirm = null; saveActiveSoon(); render(); break;
    case "addex-open": S.addingEx = true; render(); $("#add-name")?.focus(); break;
    case "addex-cancel": S.addingEx = false; render(); break;
    case "addex": {
      const name = $("#add-name").value.trim(); if (!name) { $("#add-name").focus(); break; }
      const last = lastFor(name, a.editingId);
      a.exercises.push(newExercise(name, last ? last.e.equip : $("#add-equip").value));
      S.addingEx = false; saveActiveSoon(); render();
      document.getElementById(`card-${a.exercises.length - 1}`)?.scrollIntoView({block: "center"}); break;
    }
    case "finish": finishWorkout(); break;
    case "export": exportBackup(); break;
    case "import": $("#import-file").value = ""; $("#import-file").click(); break;
    case "import-apply": applyImport(); break;
    case "import-cancel": S.importData = null; render(); break;
    case "discard": {
      const wasEdit = a && a.editingId;
      S.active = null; S.view = "start"; S.confirm = null; S.timer = null; saveActiveSoon(); flushActive(); releaseAwake();
      if (wasEdit) S.tab = "history";
      render(); toast(wasEdit ? "Edits dropped" : "Workout discarded"); break;
    }
    case "edit": editWorkout(b.dataset.id); break;
    case "delw": delDoc("workouts", b.dataset.id); S.confirm = null; render(); toast("Workout deleted"); break;
    case "timer": startTimer(+b.dataset.s); break;
    case "timer-add": if (S.timer) { S.timer.end = (S.timer.done ? Date.now() : S.timer.end) + 30000; S.timer.done = false; renderTimer(); } break;
    case "timer-stop": S.timer = null; renderTimer(); break;
    case "lift": S.lift = b.dataset.k; render(); window.scrollTo({top: 0, behavior: "smooth"}); break;
    case "bw-save": {
      const w = num($("#bw-weight").value), d = $("#bw-date").value || today();
      if (w == null || w <= 0) { $("#bw-weight").focus(); toast("Enter your weight in pounds"); break; }
      setDoc("bodyweight", d, {date: d, weight: w}); toast(`Saved ${fmtW(w)} lb for ${fmtShort(d)}`);
      break;
    }
    case "delbw": delDoc("bodyweight", b.dataset.id); S.confirm = null; render(); break;
    case "r-new": S.editRoutine = {id: uid("r"), isNew: true, name: "", order: S.routines.length, exercises: [{name: "", equip: "machine", sets: 3, reps: 10, perSide: false}]}; render(); break;
    case "r-edit": { const r = S.routines.find(r => r.id === b.dataset.id); S.editRoutine = {...clone(r), isNew: false}; S.confirm = null; render(); break; }
    case "r-cancel": S.editRoutine = null; S.confirm = null; render(); break;
    case "r-add": S.editRoutine.exercises.push({name: "", equip: "machine", sets: 3, reps: 10, perSide: false}); render(); $(`#r-${S.editRoutine.exercises.length - 1}-name`)?.focus(); break;
    case "r-rm": S.editRoutine.exercises.splice(i, 1); render(); break;
    case "r-move": { const xs = S.editRoutine.exercises, j = i + +b.dataset.d; if (j >= 0 && j < xs.length) { [xs[i], xs[j]] = [xs[j], xs[i]]; render(); } break; }
    case "r-save": {
      const r = S.editRoutine; const name = r.name.trim();
      if (!name) { $("#r-name").focus(); toast("Give the routine a name"); break; }
      setDoc("routines", r.id, {name, order: r.order ?? 0, exercises: r.exercises.filter(x => x.name.trim()).map(x => ({name: x.name.trim(), equip: x.equip, sets: num(x.sets), reps: num(x.reps), perSide: !!x.perSide}))});
      S.editRoutine = null; render(); toast("Routine saved"); break;
    }
    case "r-del": delDoc("routines", S.editRoutine.id); S.editRoutine = null; S.confirm = null; render(); toast("Routine deleted"); break;
  }
});
function replaceCard(i) {
  const el = document.getElementById(`card-${i}`); if (!el) return render();
  el.outerHTML = exCard(S.active.exercises[i], i);
}
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "lift-pick") return;
  if (S.active && t.dataset.s) { S.active[t.dataset.s] = t.value; if (t.dataset.s === "timeIn") $("#hdrsub").textContent = `In progress · ${fmtTime(t.value)}`; saveActiveSoon(); return; }
  if (S.active && t.dataset.i != null && t.dataset.f) {
    const ex = S.active.exercises[+t.dataset.i]; if (!ex) return;
    const f = t.dataset.f;
    ex[f] = t.type === "checkbox" ? t.checked : (f === "note" ? t.value : (t.value === "" ? null : num(t.value)));
    if (f === "weight") { const p = $(`#plates-${t.dataset.i}`); if (p) p.textContent = plateText(ex); }
    saveActiveSoon(); return;
  }
  if (S.editRoutine) {
    if (t.dataset.r) S.editRoutine[t.dataset.r] = t.value;
    else if (t.dataset.ri != null) S.editRoutine.exercises[+t.dataset.ri][t.dataset.f] = t.type === "checkbox" ? t.checked : t.value;
  }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.id === "lift-pick") { S.lift = t.value; render(); return; }
  if (t.id === "import-file") { if (t.files && t.files[0]) readImport(t.files[0]); return; }
  if (S.active && t.dataset.f === "perSide" && t.dataset.i != null) replaceCard(+t.dataset.i);
});
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (S.tab === "progress") drawLift(); if (S.tab === "body") drawBody(); }, 150); });
window.addEventListener("pagehide", () => { if (activeTimer) flushActive(); });

render();
initStore();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
